name: Android Release (Offix)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/**'
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install node dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Decode keystore from secrets
        working-directory: mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > mesnation-release-key.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️ KEYSTORE_BASE64 not set — fallback to debug signing"
          fi

      - name: Prepare signing properties
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/mesnation-release-key.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo ""
              echo "MYAPP_UPLOAD_STORE_FILE=mesnation-release-key.jks"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS:-mesnation}"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> gradle.properties
            echo "✅ Release signing configured"
          else
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
            echo "⚠️ Fallback: debug signing"
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename to Offix.apk
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/Offix.apk
          ls -lh artifacts/

      - name: Upload artifact Offix
        uses: actions/upload-artifact@v4
        with:
          name: Offix
          path: artifacts/Offix.apk

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Offix.apk
          name: "Offix ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
