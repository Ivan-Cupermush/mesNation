name: Android Release (Offix)

# Каждый пуш в main с изменениями мобилки собирает APK и публикует его
# в GitHub Releases (последний релиз = актуальная версия для установки).
# Ручной запуск (Actions → Android Release → Run workflow) с любой ветки
# публикует тестовую сборку как pre-release — удобно проверить ветку до мержа.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      # Номер версии растёт с каждой сборкой, чтобы Android ставил обновление поверх.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.1.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install node dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Typecheck and tests
        working-directory: mobile
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Decode keystore from secrets
        working-directory: mobile/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-from-secrets.jks
            echo "Keystore из секретов"
          else
            echo "KEYSTORE_BASE64 не задан — подпись ключом из репозитория"
          fi

      - name: Firebase config for push notifications
        working-directory: mobile/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Секрет — содержимое google-services.json (как есть или в base64).
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            fi
            echo "Firebase подключён: push будут приходить и при закрытом приложении"
          else
            echo "GOOGLE_SERVICES_JSON не задан — сборка без Firebase (уведомления, пока приложение запущено)"
          fi

      - name: Prepare signing properties
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f app/release-from-secrets.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            {
              echo ""
              echo "MYAPP_UPLOAD_STORE_FILE=release-from-secrets.jks"
              echo "MYAPP_UPLOAD_KEY_ALIAS=${KEY_ALIAS:-mesnation}"
              echo "MYAPP_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MYAPP_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> gradle.properties
            echo "Подпись ключом из секретов"
          elif ! grep -q '^MYAPP_UPLOAD_STORE_FILE=' gradle.properties; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' app/build.gradle
            echo "Подпись debug-ключом"
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PAPP_VERSION_CODE=$VERSION_CODE -PAPP_VERSION_NAME=$VERSION_NAME

      - name: Rename to Offix.apk
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/Offix-$VERSION_NAME.apk"
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Offix-${{ env.VERSION_NAME }}
          path: artifacts/*.apk

      - name: Release notes
        run: |
          {
            echo "Сборка из \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})."
            echo ""
            echo "Установка: скачайте Offix-$VERSION_NAME.apk ниже и откройте на телефоне."
            echo ""
            echo "### Последние изменения"
            git log -15 --pretty='- %s' 2>/dev/null || true
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name == 'main' && format('Offix {0}', env.VERSION_NAME) || startsWith(github.ref, 'refs/tags/') && format('Offix {0}', github.ref_name) || format('Offix {0} (тест {1})', env.VERSION_NAME, github.ref_name) }}
          body_path: release-notes.md
          files: artifacts/*.apk
          prerelease: ${{ github.ref_name != 'main' && !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/') }}
